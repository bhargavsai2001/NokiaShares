<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Nokia Share Widget</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background: transparent;
    font-family: 'Inter', 'Roboto', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .widget-wrap {
    width: 100%;
    height: 100%;
    min-height: 110px;
    padding: 4px;
    display: flex;
    align-items: stretch;
  }

  .widget-card {
    flex: 1;
    background: rgba(12, 17, 30, 0.88);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 18px;
    padding: 13px 15px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    position: relative;
    overflow: hidden;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.09),
      0 8px 32px rgba(0,0,0,0.55);
  }

  .widget-card::before {
    content: '';
    position: absolute;
    top: 0; left: 10%; right: 10%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
  }

  /* Subtle ambient glow bottom-right */
  .widget-card::after {
    content: '';
    position: absolute;
    bottom: -20px; right: -20px;
    width: 80px; height: 80px;
    background: radial-gradient(circle, rgba(34,197,94,0.10), transparent 70%);
    pointer-events: none;
  }

  /* ─── Title row ─── */
  .title-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 6px rgba(34,197,94,0.7);
    flex-shrink: 0;
    transition: background 0.3s, box-shadow 0.3s;
  }

  .status-dot.error {
    background: #ef4444;
    box-shadow: 0 0 6px rgba(239,68,68,0.7);
  }

  .title-text {
    font-size: 10.5px;
    font-weight: 600;
    color: rgba(255,255,255,0.45);
    letter-spacing: 0.09em;
    text-transform: uppercase;
  }

  /* ─── Main content row ─── */
  .main-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    flex: 1;
    gap: 8px;
  }

  /* ─── Left column ─── */
  .left-col {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
    flex: 1;
    min-width: 0;
  }

  .gross-value {
    font-size: 27px;
    font-weight: 700;
    color: #22c55e;
    letter-spacing: -0.6px;
    line-height: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .change-row {
    display: flex;
    align-items: center;
    gap: 3px;
    font-size: 11.5px;
    font-weight: 500;
    flex-wrap: nowrap;
    white-space: nowrap;
  }

  .arrow-icon {
    font-size: 10px;
    line-height: 1;
  }
  .arrow-icon.up  { color: #22c55e; }
  .arrow-icon.down { color: #ef4444; }

  .change-amount.up  { color: #22c55e; }
  .change-amount.down { color: #ef4444; }

  /* ─── Right column ─── */
  .right-col {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: center;
    gap: 3px;
    flex-shrink: 0;
  }

  .price-usd {
    font-size: 15px;
    font-weight: 600;
    color: rgba(255,255,255,0.92);
    letter-spacing: -0.3px;
    white-space: nowrap;
  }

  .price-eur {
    font-size: 13px;
    font-weight: 500;
    color: rgba(255,255,255,0.72);
    letter-spacing: -0.2px;
    white-space: nowrap;
  }

  .last-updated {
    font-size: 9px;
    font-weight: 400;
    color: rgba(255,255,255,0.28);
    text-align: right;
    line-height: 1.45;
    letter-spacing: 0.02em;
  }

  /* ─── Skeleton loader ─── */
  .skel {
    display: inline-block;
    border-radius: 4px;
    background: rgba(255,255,255,0.07);
    animation: shimmer 1.5s ease-in-out infinite;
    vertical-align: middle;
  }

  @keyframes shimmer {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.8; }
  }

  /* ─── Error ─── */
  .err-txt {
    font-size: 11px;
    color: rgba(239,68,68,0.85);
  }
</style>
</head>
<body>

<div class="widget-wrap">
  <div class="widget-card">

    <div class="title-row">
      <div class="status-dot" id="statusDot"></div>
      <span class="title-text">Nokia Share</span>
    </div>

    <div class="main-row">
      <div class="left-col">
        <div class="gross-value" id="grossValue">
          <span class="skel" style="width:115px;height:26px;">&nbsp;</span>
        </div>
        <div class="change-row" id="changeRow">
          <span class="skel" style="width:88px;height:12px;">&nbsp;</span>
        </div>
      </div>

      <div class="right-col">
        <div class="price-usd" id="priceUsd">
          <span class="skel" style="width:56px;height:15px;">&nbsp;</span>
        </div>
        <div class="price-eur" id="priceEur">
          <span class="skel" style="width:50px;height:13px;">&nbsp;</span>
        </div>
        <div class="last-updated" id="lastUpdated">Fetching…</div>
      </div>
    </div>

  </div>
</div>

<script>
  const SHARES    = 1000;
  const FINN_KEY  = 'SH9FASWYSA0SM2HN';
  const FX_KEY    = '648176f0273f327e98cd7bf9';
  const SYMBOL    = 'NOK';

  function fmtINR(val) {
    return '₹' + Math.round(val).toLocaleString('en-IN');
  }

  function fmtNum(n, d) {
    return n.toFixed(d);
  }

  function nowStr() {
    const d   = new Date();
    const dt  = d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: '2-digit' });
    const tm  = d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
    return dt + '\n' + tm;
  }

  async function fetchData() {
    try {
      const [qRes, fxRes] = await Promise.all([
        fetch('https://finnhub.io/api/v1/quote?symbol=' + SYMBOL + '&token=' + FINN_KEY),
        fetch('https://v6.exchangerate-api.com/v6/' + FX_KEY + '/latest/USD')
      ]);

      if (!qRes.ok || !fxRes.ok) throw new Error('API error');

      const quote  = await qRes.json();
      const fx     = await fxRes.json();

      if (!quote.c || quote.c === 0) throw new Error('No price data');

      const priceUSD  = quote.c;
      const prevUSD   = quote.pc;
      const usdToINR  = fx.conversion_rates.INR;
      const usdToEUR  = fx.conversion_rates.EUR;

      const priceEUR  = priceUSD * usdToEUR;
      const grossINR  = priceUSD * SHARES * usdToINR;
      const prevINR   = prevUSD  * SHARES * usdToINR;
      const chgINR    = grossINR - prevINR;
      const chgPct    = (chgINR / prevINR) * 100;

      const isUp = chgINR >= 0;
      const dir  = isUp ? 'up' : 'down';
      const arr  = isUp ? '▲' : '▼';

      document.getElementById('grossValue').textContent = fmtINR(grossINR);

      document.getElementById('changeRow').innerHTML =
        `<span class="arrow-icon ${dir}">${arr}</span>` +
        `<span class="change-amount ${dir}">${fmtINR(Math.abs(chgINR))} (${Math.abs(chgPct).toFixed(2)}%)</span>`;

      document.getElementById('priceUsd').textContent = '$' + fmtNum(priceUSD, 3);
      document.getElementById('priceEur').textContent = '€' + fmtNum(priceEUR, 3);
      document.getElementById('lastUpdated').textContent = nowStr();

      const dot = document.getElementById('statusDot');
      dot.classList.remove('error');

    } catch (err) {
      document.getElementById('grossValue').innerHTML   = '<span class="err-txt">Error loading</span>';
      document.getElementById('changeRow').innerHTML    = '<span class="err-txt">Check connection</span>';
      document.getElementById('priceUsd').textContent   = '—';
      document.getElementById('priceEur').textContent   = '—';
      document.getElementById('lastUpdated').textContent = 'Failed';

      const dot = document.getElementById('statusDot');
      dot.classList.add('error');
    }
  }

  fetchData();

  // Auto-refresh every 5 minutes
  setInterval(fetchData, 5 * 60 * 1000);
</script>

</body>
</html>
