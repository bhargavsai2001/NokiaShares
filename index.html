<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Nokia Share Widget</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background: #0a0f1e;
    font-family: 'Inter', 'Roboto', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .widget-wrap {
    width: 100%;
    height: 100%;
    min-height: 110px;
    padding: 5px;
    display: flex;
    align-items: stretch;
  }

  .widget-card {
    flex: 1;
    background: linear-gradient(135deg, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0.03) 100%);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 18px;
    padding: 13px 15px 11px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    position: relative;
    overflow: hidden;
  }

  .widget-card::before {
    content: '';
    position: absolute;
    top: 0; left: 10%; right: 10%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
  }

  .widget-card::after {
    content: '';
    position: absolute;
    bottom: -30px; right: -20px;
    width: 100px; height: 100px;
    background: radial-gradient(circle, rgba(34,197,94,0.08), transparent 70%);
    pointer-events: none;
  }

  .title-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #555;
    flex-shrink: 0;
    transition: background 0.4s, box-shadow 0.4s;
  }
  .status-dot.live  { background: #22c55e; box-shadow: 0 0 6px rgba(34,197,94,0.7); }
  .status-dot.error { background: #ef4444; box-shadow: 0 0 6px rgba(239,68,68,0.7); }

  .title-text {
    font-size: 10.5px;
    font-weight: 600;
    color: rgba(255,255,255,0.40);
    letter-spacing: 0.09em;
    text-transform: uppercase;
  }

  .main-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    flex: 1;
    gap: 8px;
  }

  .left-col {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
    flex: 1;
    min-width: 0;
  }

  .gross-value {
    font-size: 26px;
    font-weight: 700;
    color: #22c55e;
    letter-spacing: -0.6px;
    line-height: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .change-row {
    display: flex;
    align-items: center;
    gap: 3px;
    font-size: 11.5px;
    font-weight: 500;
    white-space: nowrap;
  }

  .arrow-icon       { font-size: 10px; line-height: 1; }
  .arrow-icon.up    { color: #22c55e; }
  .arrow-icon.down  { color: #ef4444; }
  .chg.up           { color: #22c55e; }
  .chg.down         { color: #ef4444; }

  .right-col {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: center;
    gap: 3px;
    flex-shrink: 0;
  }

  .price-usd {
    font-size: 15px;
    font-weight: 600;
    color: rgba(255,255,255,0.92);
    letter-spacing: -0.3px;
    white-space: nowrap;
  }

  .price-eur {
    font-size: 13px;
    font-weight: 500;
    color: rgba(255,255,255,0.70);
    letter-spacing: -0.2px;
    white-space: nowrap;
  }

  .last-updated {
    font-size: 9px;
    font-weight: 400;
    color: rgba(255,255,255,0.28);
    text-align: right;
    line-height: 1.5;
    letter-spacing: 0.02em;
    white-space: pre-line;
  }

  .skel {
    display: inline-block;
    border-radius: 4px;
    background: rgba(255,255,255,0.07);
    animation: shimmer 1.5s ease-in-out infinite;
    vertical-align: middle;
  }
  @keyframes shimmer {
    0%,100% { opacity: 0.35; }
    50%      { opacity: 0.75; }
  }

  .err {
    font-size: 10.5px;
    color: rgba(239,68,68,0.85);
    line-height: 1.4;
  }
</style>
</head>
<body>

<div class="widget-wrap">
  <div class="widget-card">

    <div class="title-row">
      <div class="status-dot" id="dot"></div>
      <span class="title-text">Nokia Share</span>
    </div>

    <div class="main-row">
      <div class="left-col">
        <div class="gross-value" id="gross">
          <span class="skel" style="width:115px;height:25px;">&nbsp;</span>
        </div>
        <div class="change-row" id="chgRow">
          <span class="skel" style="width:90px;height:12px;">&nbsp;</span>
        </div>
      </div>

      <div class="right-col">
        <div class="price-usd" id="pUsd">
          <span class="skel" style="width:56px;height:15px;">&nbsp;</span>
        </div>
        <div class="price-eur" id="pEur">
          <span class="skel" style="width:50px;height:13px;">&nbsp;</span>
        </div>
        <div class="last-updated" id="updated">Fetching...</div>
      </div>
    </div>

  </div>
</div>

<script>
var SHARES   = 1000;
var FINN_KEY = 'clbn621r01qp535svssgclbn621r01qp535svst0';
var FX_KEY   = '648176f0273f327e98cd7bf9';
var SYMBOL   = 'NOK';

function el(id) { return document.getElementById(id); }

function fmtINR(v) {
  return '\u20B9' + Math.round(v).toLocaleString('en-IN');
}

function nowStr() {
  var d  = new Date();
  var dt = d.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'2-digit' });
  var tm = d.toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit', hour12:true });
  return dt + '\n' + tm;
}

/* Fetch with automatic CORS-proxy fallback */
function safeFetch(url) {
  return fetch(url)
    .then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .catch(function() {
      /* fallback: route through allorigins proxy */
      var proxy = 'https://api.allorigins.win/get?url=' + encodeURIComponent(url);
      return fetch(proxy)
        .then(function(r) {
          if (!r.ok) throw new Error('Proxy HTTP ' + r.status);
          return r.json();
        })
        .then(function(wrapper) {
          return JSON.parse(wrapper.contents);
        });
    });
}

function setError(msg) {
  el('gross').innerHTML  = '<span class="err">Error loading</span>';
  el('chgRow').innerHTML = '<span class="err">' + (msg || 'Check connection') + '</span>';
  el('pUsd').textContent = '-';
  el('pEur').textContent = '-';
  el('updated').textContent = 'Failed ' + new Date().toLocaleTimeString('en-IN',{ hour:'2-digit', minute:'2-digit', hour12:true });
  el('dot').className    = 'status-dot error';
}

function refresh() {
  el('dot').className = 'status-dot';

  var finnURL = 'https://finnhub.io/api/v1/quote?symbol=' + SYMBOL + '&token=' + FINN_KEY;
  var fxURL   = 'https://v6.exchangerate-api.com/v6/' + FX_KEY + '/latest/USD';

  Promise.all([ safeFetch(finnURL), safeFetch(fxURL) ])
    .then(function(results) {
      var quote = results[0];
      var fx    = results[1];

      if (!quote || !quote.c || quote.c === 0) {
        throw new Error('No price data');
      }
      if (!fx || !fx.conversion_rates) {
        throw new Error('No FX data');
      }

      var priceUSD = quote.c;
      var prevUSD  = quote.pc;
      var toINR    = fx.conversion_rates.INR;
      var toEUR    = fx.conversion_rates.EUR;

      var priceEUR = priceUSD * toEUR;
      var grossINR = priceUSD * SHARES * toINR;
      var prevINR  = prevUSD  * SHARES * toINR;
      var chgINR   = grossINR - prevINR;
      var chgPct   = (chgINR / prevINR) * 100;

      var isUp = chgINR >= 0;
      var dir  = isUp ? 'up' : 'down';
      var arr  = isUp ? '\u25B2' : '\u25BC';

      el('gross').textContent = fmtINR(grossINR);

      el('chgRow').innerHTML =
        '<span class="arrow-icon ' + dir + '">' + arr + '</span>' +
        '<span class="chg ' + dir + '">' + fmtINR(Math.abs(chgINR)) + ' (' + Math.abs(chgPct).toFixed(2) + '%)</span>';

      el('pUsd').textContent    = '$' + priceUSD.toFixed(3);
      el('pEur').textContent    = '\u20AC' + priceEUR.toFixed(3);
      el('updated').textContent = nowStr();
      el('dot').className       = 'status-dot live';
    })
    .catch(function(err) {
      setError(err.message ? err.message.slice(0, 35) : 'Check connection');
      console.error('[Nokia Widget] ' + (err.message || err));
    });
}

refresh();
setInterval(refresh, 5 * 60 * 1000);
</script>

</body>
</html>
