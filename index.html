<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nokia Portfolio Tracker</title>
<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .card {
        background: rgba(255,255,255,0.05);
        backdrop-filter: blur(20px);
        border-radius: 20px;
        padding: 25px;
        width: 320px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        text-align: center;
    }

    .title {
        font-size: 18px;
        color: #94a3b8;
        margin-bottom: 10px;
    }

    .price {
        font-size: 32px;
        font-weight: bold;
        margin: 10px 0;
        color: #38bdf8;
    }

    .sub {
        font-size: 14px;
        color: #cbd5f5;
        margin-top: 5px;
    }

    .value {
        font-size: 26px;
        margin-top: 15px;
        color: #22c55e;
    }

    .loader {
        margin-top: 15px;
        font-size: 13px;
        color: #94a3b8;
    }
    .change {
        margin-top: 10px;
        font-size: 16px;
        font-weight: bold;
    }

    .up { 
        color: #22c55e; 
    }
    .down { 
        color: #ef4444; 
    }
</style>
</head>
<body>

<div class="card">
    <div class="title">Nokia Portfolio (1000 Shares)</div>

    <div id="usdPrice" class="price">Loading...</div>

    <div id="eurPrice" class="sub"></div>

    <div id="inrValue" class="value"></div>

    <div id="change" class="change"></div>

    <div id="status" class="loader">Fetching data...</div>
</div>

<script>
const ALPHA_KEY = "SH9FASWYSA0SM2HN";
const FX_KEY = "648176f0273f327e98cd7bf9";
const SHARES = 1000;

async function fetchData() {
    try {
        // STOCK DATA
        const stockRes = await fetch(`https://www.alphavantage.co/query?function=GLOBAL_QUOTE&symbol=NOK&apikey=${ALPHA_KEY}`);
        const stockData = await stockRes.json();

        const currentUSD = parseFloat(stockData["Global Quote"]["05. price"]);
        const prevUSD = parseFloat(stockData["Global Quote"]["08. previous close"]);

        const usdChange = currentUSD - prevUSD;

        // USD → EUR
        const usdEurRes = await fetch(`https://v6.exchangerate-api.com/v6/${FX_KEY}/pair/USD/EUR`);
        const usdToEur = (await usdEurRes.json()).conversion_rate;

        // EUR → INR
        const eurInrRes = await fetch(`https://v6.exchangerate-api.com/v6/${FX_KEY}/pair/EUR/INR`);
        const eurToInr = (await eurInrRes.json()).conversion_rate;

        // PRICE CONVERSIONS
        const eurPrice = currentUSD * usdToEur;
        const inrValue = eurPrice * eurToInr * SHARES;

        // CHANGE CALCULATION
        const eurChange = usdChange * usdToEur;
        const inrChange = eurChange * eurToInr * SHARES;

        // UI UPDATE
        document.getElementById("usdPrice").innerText = `$${currentUSD.toFixed(2)}`;
        document.getElementById("eurPrice").innerText = `≈ €${eurPrice.toFixed(2)} per share`;
        document.getElementById("inrValue").innerText = `₹ ${inrValue.toLocaleString('en-IN')}`;

        // ARROW + COLOR
        const changeEl = document.getElementById("change");

        if (inrChange >= 0) {
            changeEl.innerHTML = `↑ ₹ ${Math.abs(inrChange).toLocaleString('en-IN')} (Today)`;
            changeEl.className = "change up";
        } else {
            changeEl.innerHTML = `↓ ₹ ${Math.abs(inrChange).toLocaleString('en-IN')} (Today)`;
            changeEl.className = "change down";
        }

        document.getElementById("status").innerText = "Updated live";

    } catch (err) {
        document.getElementById("status").innerText = "Error fetching data";
        console.error(err);
    }
}

fetchData();
setInterval(fetchData, 60000);
</script>

</body>
</html>
