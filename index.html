<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
    margin:0;
    height:100%;
    font-family:Segoe UI, sans-serif;
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
}

.container {
    height:100%;
    padding:20px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
}

.header {
    font-size:18px;
    color:#94a3b8;
}

.grid {
    display:grid;
    grid-template-columns:1fr 1fr;
    align-items:center;
}

.price {
    font-size:44px;
    color:#38bdf8;
    font-weight:bold;
}

.sub {
    font-size:14px;
    color:#cbd5f5;
}

.value {
    font-size:36px;
    color:#22c55e;
    font-weight:bold;
}

.change {
    font-size:18px;
    font-weight:bold;
}

.up { color:#22c55e; }
.down { color:#ef4444; }

.footer {
    font-size:12px;
    text-align:right;
    color:#94a3b8;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">Nokia Portfolio (1000 Shares)</div>

    <div class="grid">
        <div>
            <div id="usdPrice" class="price">--</div>
            <div id="eurPrice" class="sub"></div>
        </div>

        <div style="text-align:right;">
            <div id="inrValue" class="value"></div>
            <div id="change" class="change"></div>
        </div>
    </div>

    <div id="status" class="footer">Updating...</div>

</div>

<script>
const FINNHUB_KEY = "clbn621r01qp535svssgclbn621r01qp535svst0";
const FX_KEY = "648176f0273f327e98cd7bf9";
const SHARES = 1000;

async function fetchData() {
    try {
        document.getElementById("status").innerText = "Updating...";

        // 🔹 USD price from Finnhub (NOK)
        const stockRes = await fetch(`https://finnhub.io/api/v1/quote?symbol=NOK&token=${FINNHUB_KEY}`);
        const stockData = await stockRes.json();

        const currentUSD = stockData.c;
        const prevUSD = stockData.pc;

        if (!currentUSD || !prevUSD) throw new Error("Stock data error");

        const usdChange = currentUSD - prevUSD;

        // 🔹 USD → EUR
        const usdEur = await fetch(`https://v6.exchangerate-api.com/v6/${FX_KEY}/pair/USD/EUR`)
            .then(r => r.json());

        // 🔹 EUR → INR
        const eurInr = await fetch(`https://v6.exchangerate-api.com/v6/${FX_KEY}/pair/EUR/INR`)
            .then(r => r.json());

        if (!usdEur.conversion_rate || !eurInr.conversion_rate)
            throw new Error("FX error");

        const usdToEur = usdEur.conversion_rate;
        const eurToInr = eurInr.conversion_rate;

        // 🔹 Conversions
        const eurPrice = currentUSD * usdToEur;
        const inrValue = eurPrice * eurToInr * SHARES;

        const eurChange = usdChange * usdToEur;
        const inrChange = eurChange * eurToInr * SHARES;

        // 🔹 UI update
        document.getElementById("usdPrice").innerText = `$${currentUSD.toFixed(2)}`;
        document.getElementById("eurPrice").innerText = `€${eurPrice.toFixed(2)} / share`;
        document.getElementById("inrValue").innerText = `₹ ${inrValue.toLocaleString('en-IN')}`;

        const changeEl = document.getElementById("change");

        if (inrChange >= 0) {
            changeEl.innerHTML = `↑ ₹ ${Math.abs(inrChange).toLocaleString('en-IN')}`;
            changeEl.className = "change up";
        } else {
            changeEl.innerHTML = `↓ ₹ ${Math.abs(inrChange).toLocaleString('en-IN')}`;
            changeEl.className = "change down";
        }

        document.getElementById("status").innerText = "Updated";

    } catch (err) {
        console.error(err);

        document.getElementById("status").innerText = "Error loading data";
        document.getElementById("usdPrice").innerText = "--";
        document.getElementById("eurPrice").innerText = "Retry";
        document.getElementById("inrValue").innerText = "₹ --";
        document.getElementById("change").innerText = "";
    }
}

fetchData();
setInterval(fetchData, 60000);
</script>

</body>
</html>
